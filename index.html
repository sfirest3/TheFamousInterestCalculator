<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interest Calculator</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <article>
      <header>
        <div><font face="Courier">⭐⭐⭐⭐</font></div>
        <div><font face="Verdana">Interest Calculator</font></div>
        <div><font face="Courier">⭐⭐⭐⭐</font></div>
      </header>
      <main>
        <form>
          <div>Principal:</div>
          <input id="principal" type="number" />
          <div>Compounding Period:</div>
          <select id="period">
            <option value="">Select</option>
            <option value="Yearly">Yearly</option>
            <option value="Quarterly">Quarterly</option>
            <option value="Monthly">Monthly</option>
            <option value="Daily">Daily</option>
          </select>
          <div>APR:</div>
          <input type="range" id="apr" value="2" min="0.25" max="50" />
          <div>Years:</div>
          <input id="years" type="number" />
        </form>
        <p>Interest Rate (APR): <output id="accumulated"></output></p>
        <p>Interest Earned: <output id="interestEarned"></output></p>
        <p>Total Amount: <output id="total"></output></p>
      </main>
      <footer>
        <div>© 2024</div>
        <div><a href="https://codesandbox.io/p/sandbox/hg873v?">Code</a></div>
      </footer>
    </article>
  </body>
</html>
